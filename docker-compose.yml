name: vigie

x-app: &app
  build: .
  image: vigie-maritime:latest
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: &app-env
    KAFKA_BOOTSTRAP: kafka:29092
    DATABASE_URL: postgresql://vigie:vigie@postgres:5432/vigie
    # LLM open source local (Ollama). LLM_URL= (vide) dans .env désactive l'IA.
    LLM_URL: ${LLM_URL-http://ollama:11434}
    LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
  volumes:
    - ./data:/app/data

services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: vigie
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"   # 5433 côté hôte pour ne pas entrer en conflit avec un PostgreSQL local
    environment:
      POSTGRES_USER: vigie
      POSTGRES_PASSWORD: vigie
      POSTGRES_DB: vigie
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigie"]
      interval: 5s
      timeout: 5s
      retries: 20

  producer:
    <<: *app
    command: ["python", "-m", "maritime.producer"]
    depends_on:
      kafka:
        condition: service_healthy

  processor:
    <<: *app
    command: ["python", "-m", "maritime.processor"]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["uvicorn", "maritime.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./data:/app/data
      - ./web:/app/web:ro   # l'interface peut être modifiée sans reconstruire l'image
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      processor:
        condition: service_started

  # --- IA : LLM open source servi localement ----------------------------------
  ollama:
    image: ollama/ollama:0.40.11
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: "24h"      # garde le modèle en mémoire (pas de rechargement entre deux questions)
      OLLAMA_NUM_PARALLEL: "1"      # CPU : une génération à la fois, plus rapide qu'en parallèle
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Télécharge le modèle une fois (≈ 2 Go pour qwen2.5:3b), puis s'arrête
  ollama-pull:
    image: ollama/ollama:0.40.11
    restart: "no"
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-qwen2.5:3b}"]
    environment:
      OLLAMA_HOST: ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  briefer:
    <<: *app
    command: ["python", "-m", "maritime.briefer"]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  # --- Big Data : agrégats temps réel avec Spark Structured Streaming ------------
  spark:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: vigie-spark:latest
    command: ["python", "-m", "maritime.spark.job"]
    volumes:
      - ./data:/app/data
      - spark-checkpoints:/app/checkpoints   # offsets Kafka et état des fenêtres
    ports:
      - "4040:4040"   # Spark UI (requêtes de streaming, débit, état)
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  kafka-data:
  pg-data:
  ollama-models:
  spark-checkpoints:
